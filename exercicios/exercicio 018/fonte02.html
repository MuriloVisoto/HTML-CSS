<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontes externas</title>
    <style>
        @font-face {
            font-family: 'Batuphat';
            src: url(fontes/Batuphat\ Script.otf);
            font-weight: normal;
            font-style: normal;
        }

    /*    
    Tipos de format()
    - opentype (otf)
    - truetype (ttf)
    - embedded-opentype
    - truetype-aat (Apple Advanced Typography)
    - svg
    */

        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Batuphat', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas nemo velit possimus, sunt exercitationem dicta in ad fuga non autem eos voluptate magni voluptatem corporis eius blanditiis dolor doloremque laboriosam.</p>
</body>
</html>
