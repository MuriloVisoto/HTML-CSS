<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

           /*border: 10px solid lightgray*/
            border-width: 5px;
            border-style: solid;
            border-color: brown;

           /*10px 10px 10px 10px. ou so 10px se todos os lados forem iguais*/
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

           /*margin: 20px 20px 40px 20px; ou
           margin: 20px auto 40px auto;, pra centralizar*/
           /*margin-auto= centraliza*/
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;

           /*outline: 5px dashed aquamarine*/
            outline-width: 5px;
            outline-style: dashed;
            outline-color: aquamarine;
        }

        a {
           border: 2px solid brown;
        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>Páragrafos também são exemplos de box-level, mas os <a href="#"> links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso fuciona.
    </p>
</body>
</html>
