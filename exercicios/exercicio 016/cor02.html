<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
       
        body{
            background-image: linear-gradient(to bottom, #D8ECF2, #94BBC8, #5B8D9D, #2F6273);
           background-attachment: fixed;
        }

        input{
            background-image: linear-gradient(to bottom, #55696d);
        }
    </style>
</head>
<body>
    <h1>Testando gradientes</h1>
    <input type="email" placeholder="seu@email.com">
</body>
</html>
